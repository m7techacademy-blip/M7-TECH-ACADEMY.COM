  .search-box { margin-top:30px; padding-top:30px;

  .search-box h3 { font-size:14px; margin-bottom:12px; opacity:.8; }
  .search-input { display:flex; gap:8px; }
  .search-input input { flex:1; background:rgba(255,255,255,.06);

    padding:12px 14px; border-radius:10px; font-size:14px; }
  .search-input input:focus { outline:none; border-color:#a855f7; }
  .search-input button { padding:12px 20px; border:none; border-radius:10px;
    background:linear-gradient(135deg,#a855f7,#ec4899); color:#fff;
    font-weight:600; font-size:13px; cursor:pointer; }
  .loading { text-align:center; padding:40px 0; }
  .spinner { display:inline-block; width:40px; height:40px;
    border:4px solid rgba(255,255,255,.2); border-top-color:#a855f7;
    border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .footer { margin-top:30px; font-size:10px; opacity:.4; }

  <h1>M7 TECH ACADEMY</h1>
  <div class="sub">Certificate Verification</div>

    <div class="loading"><div class="spinner"></div><p style="margin-top:16px;opacity:.6">Checking certificate...</p></div>
  </div>

  <div class="search-box">
    <h3>🔍 Search by Certificate Number</h3>
    <div class="search-input">
      <input type="text" id="searchInput" placeholder="e.g. CERT-2026-00301"
             onkeypress="if(event.key==='Enter')searchCert()">
      <button onclick="searchCert()">Verify</button>
    </div>
  </div>

  <div class="footer">
    © <span id="year"></span> M7 TECH ACADEMY — Muqdisho, Soomaaliya
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCOLV5mz_p-WPwpo1gZFwOOQRI_4EtyQDQ",
  authDomain: "m7tech.firebaseapp.com",
  projectId: "m7tech",
  storageBucket: "m7tech.firebasestorage.app",
  messagingSenderId: "607813872902",
  appId: "1:607813872902:web:7f9316ef68c8621f798287",
  measurementId: "G-L5RF2R970K"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

document.getElementById('year').textContent = new Date().getFullYear();

async function checkCert(certNo) {
  const content = document.getElementById('content');
  if (!certNo) {
    content.innerHTML = `
      <div class="icon-big">🔍</div>
      <div class="status-title">Enter a certificate number</div>
      <div class="status-msg">Use the search box below to verify a certificate</div>`;
    return;
  }

  content.innerHTML = `<div class="loading"><div class="spinner"></div><p style="margin-top:16px;opacity:.6">Verifying...</p></div>`;

  try {
    // 1. Get Certificate Data
    const doc = await db.collection('certificates').doc(certNo).get();
    if (!doc.exists) {
      content.innerHTML = `
        <div class="icon-big status-invalid">❌</div>
        <div class="status-title status-invalid">INVALID CERTIFICATE</div>
        <div class="status-msg">
          Certificate <strong>${certNo}</strong> was not found in our records.<br>
          This certificate may be fake or tampered with.
        </div>`;
      return;
    }

    const c = doc.data();

    // 2. Fetch Student Photo
    let studentPhotoHtml = '';
    try {
      const studentDoc = await db.collection('students').doc(c.idNo).get();
      if (studentDoc.exists && studentDoc.data().imageUrl) {
        studentPhotoHtml = `<img src="${studentDoc.data().imageUrl}" class="student-photo" alt="Student Photo">`;
      } else {
        const initials = (c.magac || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
        studentPhotoHtml = `<div class="student-photo-default">${initials}</div>`;
      }
    } catch (e) {
      console.warn("Could not load student photo", e);
    }

    // 3. Render Success
    content.innerHTML = `
      <div class="icon-big status-valid" style="font-size: 40px; margin: 10px 0;">✅</div>
      <div class="status-title status-valid">VALID CERTIFICATE</div>
      <div class="status-msg">This certificate is authentic and issued by M7 TECH ACADEMY</div>

      <div class="student-photo-wrap">
        ${studentPhotoHtml}
      </div>

      <div class="info-box">
        <div class="info-row"><span>Student Name</span><span>${c.magac}</span></div>
        <div class="info-row"><span>Student ID</span><span>${c.idNo}</span></div>
        <div class="info-row"><span>Course</span><span>${c.courseName}</span></div>
        <div class="info-row"><span>Final Grade</span><span>${c.grade} (${c.finalScore.toFixed(1)}%)</span></div>
        <div class="info-row"><span>Issue Date</span><span>${c.issueDate}</span></div>
        <div class="info-row"><span>Certificate No</span><span>${c.certNo}</span></div>
      </div>

      <div style="margin-top:16px;font-size:10px;opacity:.5">
        Verified at ${new Date().toLocaleString()}
      </div>`;
  } catch (err) {
    content.innerHTML = `
      <div class="icon-big status-invalid">⚠️</div>
      <div class="status-title status-invalid">VERIFICATION ERROR</div>
      <div class="status-msg">${err.message}</div>`;
  }
}

function searchCert() {
  const v = document.getElementById('searchInput').value.trim().toUpperCase();
  if (v) {
    history.replaceState(null, '', '?cert=' + encodeURIComponent(v));
    checkCert(v);
  }
}

// Auto-check from URL
const params = new URLSearchParams(location.search);
const cert = params.get('cert');
checkCert(cert);
</script>
